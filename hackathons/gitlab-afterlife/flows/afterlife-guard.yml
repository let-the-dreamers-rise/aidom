# Afterlife / guard
# Trigger: Pipeline events -> Failed (configured in AI > Triggers).
# Goal: the pipeline webhook payload (JSON).
#
# When a pipeline on the default branch fails, triage decides what kind of
# failure it is and routes to the right responder:
#   production -> the post-deploy smoke test failed: open an incident, open a
#                 rollback MR that restores the last good release, page the author
#   regression -> tests broke on main: find the culprit MR, open a revert MR,
#                 tell its author
#   flaky      -> infra / network noise: leave a note, nothing else
#   ignore     -> not the default branch, or not ours to handle
version: "v1"
environment: ambient

components:
  - name: "triage"
    type: AgentComponent
    prompt_id: "afterlife_guard_triage"
    inputs:
      - from: "context:goal"
        as: "pipeline_event"
    toolset:
      - "get_pipeline_failing_jobs":
          "exclude_allow_failure": true
      - "get_job_logs"
    max_cycles: 12
    ui_log_events:
      - "on_agent_reasoning"
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  - name: "rollback"
    type: AgentComponent
    prompt_id: "afterlife_guard_rollback"
    inputs:
      - from: "context:goal"
        as: "pipeline_event"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_pipeline_failing_jobs":
          "exclude_allow_failure": true
      - "get_job_logs"
      - "gitlab_api_get"
      - "get_repository_file"
      - "gitlab_merge_request_search"
      - "get_merge_request"
      - "create_commit"
      - "create_merge_request":
          "remove_source_branch": true
          "labels": "afterlife::rollback"
      - "create_issue"
      - "create_issue_note"
      - "create_merge_request_note"
    max_cycles: 50
    ui_log_events:
      - "on_agent_reasoning"
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  - name: "revert_culprit"
    type: AgentComponent
    prompt_id: "afterlife_guard_revert"
    inputs:
      - from: "context:goal"
        as: "pipeline_event"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_pipeline_failing_jobs":
          "exclude_allow_failure": true
      - "get_job_logs"
      - "gitlab_api_get"
      - "get_commit_diff"
      - "get_repository_file"
      - "gitlab_merge_request_search"
      - "get_merge_request"
      - "create_commit"
      - "create_merge_request":
          "remove_source_branch": true
          "labels": "afterlife::revert"
      - "create_merge_request_note"
    max_cycles: 50
    ui_log_events:
      - "on_agent_reasoning"
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

routers:
  - from: "triage"
    condition:
      input: "context:triage.final_answer"
      routes:
        "production": "rollback"
        "regression": "revert_culprit"
        "default_route": "end"
  - from: "rollback"
    to: "end"
  - from: "revert_culprit"
    to: "end"

flow:
  entry_point: "triage"

prompts:
  - prompt_id: "afterlife_guard_triage"
    name: "Afterlife guard triage"
    unit_primitives: []
    params:
      timeout: 180
    prompt_template:
      system: |
        You triage a failed GitLab pipeline. Your final answer must be exactly
        one lowercase word from: production, regression, flaky, ignore.

        1. From the payload: if object_attributes.ref is not
           project.default_branch, or object_attributes.status is not "failed",
           or the head commit message starts with "revert(afterlife)" or
           "rollback(afterlife)", answer ignore.
        2. Otherwise call get_pipeline_failing_jobs with the pipeline URL
           (project.web_url + "/-/pipelines/" + object_attributes.id) and read
           the logs of the failing jobs with get_job_logs.
        3. Classify:
           production  a job in stage "verify" (the post-deploy smoke test)
                       failed on a real assertion: the live site is broken.
           regression  a build/test/lint job failed on an assertion or compile
                       error that the latest changes could cause.
           flaky       runner lost, timeout with no test output, network or
                       registry errors, rate limits, "no space left".
           If unsure between regression and flaky, choose flaky.
        Answer with the single word only.
      user: |
        Pipeline event:
        {{pipeline_event}}

  - prompt_id: "afterlife_guard_rollback"
    name: "Afterlife guard rollback"
    unit_primitives: []
    params:
      timeout: 300
    prompt_template:
      system: |
        You are Afterlife's on-call responder for project {{project_id}}.
        Production failed its post-deploy smoke test. Restore service first,
        explain second. Use only facts from your tools.

        1. Evidence: get_pipeline_failing_jobs and get_job_logs for this
           pipeline. Quote the failing assertion (at most 15 lines).
        2. Last good release: gitlab_api_get
           "/projects/{{project_id}}/repository/tags" with params
           {"order_by": "version", "per_page": 5}. The last good tag is the
           newest tag that is NOT the version now on the default branch (read
           VERSION with get_repository_file at the pipeline sha).
        3. What changed: gitlab_api_get
           "/projects/{{project_id}}/repository/compare" with params
           {"from": <last good tag>, "to": <pipeline sha>}. Map commits to merged
           MRs with gitlab_merge_request_search.
        4. Incident: create_issue titled
           "Incident: production smoke test failed after v<bad version>",
           labels "afterlife::incident,severity::2". Description sections:
           Summary, Impact, Timeline (UTC, from pipeline and commit timestamps),
           Evidence (the quoted assertion), Suspected cause (the MR(s) whose
           diff touches what the assertion checks; say "unknown" if none do),
           Mitigation (link the rollback MR once created).
        5. Rollback MR: for every file in the compare diff, restore its content
           at the last good tag (get_repository_file with ref = tag; files that
           did not exist then are deleted). Keep VERSION at the current value
           but add a patch bump (the rollback ships as a new release).
           create_commit on branch "afterlife/rollback-to-<tag>" from the
           default branch, message "rollback(afterlife): restore <tag>".
           create_merge_request titled "Rollback to <tag>" whose description
           links the incident and lists the reverted MRs.
        6. create_issue_note on the incident with the rollback MR link, and
           create_merge_request_note on each suspected MR:
           "@<author> production broke after this shipped; rollback is in
           <MR link>, incident <issue link>. No action needed until the
           postmortem."
        Final answer: incident URL, rollback MR URL, suspected MR(s).
      user: |
        Pipeline event:
        {{pipeline_event}}

  - prompt_id: "afterlife_guard_revert"
    name: "Afterlife guard revert"
    unit_primitives: []
    params:
      timeout: 300
    prompt_template:
      system: |
        You keep the default branch of project {{project_id}} green. A pipeline
        on it just failed on a real regression. Find the change that caused it
        and open a revert MR. Use only facts from your tools.

        1. Read the failing jobs and their logs; note the failing test names and
           error lines.
        2. Find the last green pipeline on the default branch: gitlab_api_get
           "/projects/{{project_id}}/pipelines" with params
           {"ref": <default branch>, "status": "success", "per_page": 1}.
        3. gitlab_api_get "/projects/{{project_id}}/repository/compare" with
           {"from": <last green sha>, "to": <failed sha>}. For each commit, look
           at its diff (get_commit_diff) and pick the one whose changes the
           failing tests exercise. If several are plausible, pick the most
           recent and say so.
        4. Revert it: for each file that commit touched, write back its content
           from the commit's parent (get_repository_file with ref = parent sha;
           files the commit added are deleted). If later commits also changed
           those files, stop and explain instead of reverting.
           create_commit on branch "afterlife/revert-<short sha>" from the
           default branch, message
           "revert(afterlife): <original title>\n\nThis reverts commit <sha>."
        5. create_merge_request titled "Revert \"<original title>\"" with the
           failing test output (at most 15 lines) and why this commit is the
           cause.
        6. If the commit came from a merged MR, create_merge_request_note on it:
           "@<author> this broke <failing tests> on <default branch>; revert is
           in <MR link>. Reopen with a fix when ready."
        Final answer: the revert MR URL and the culprit commit/MR.
      user: |
        Pipeline event:
        {{pipeline_event}}
